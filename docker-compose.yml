version: '3.8'

services:
  # 1. Database
  postgis:
    image: postgis/postgis:16-3.4
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gis_user -d gis_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Object Storage (S3)
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    env_file: .env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # 3. Processing Container (Your Code)
  processor:
    build: .
    volumes:
      - ./src:/app/src
    env_file: .env
    depends_on:
      postgis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # 4. Workflow Engine
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://gis_user:dev_password@postgis:5432/gis_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - PYTHONPATH=/opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./.env:/opt/airflow/.env
    ports:
      - "8082:8080"
    user: "50000:0" # Standard Airflow user ID
    command: bash -c "airflow db migrate && airflow scheduler & airflow webserver"
    depends_on:
      postgis:
        condition: service_healthy

  # 5. Map Server
  geoserver:
    image: docker.osgeo.org/geoserver:2.24.0
    environment:
      - SKIP_DEMO_DATA=true
    ports:
      - "8081:8080"
    volumes:
      - ./geoserver_data:/opt/geoserver/data_dir