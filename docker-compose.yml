services:
  # 1. Database (PostGIS)
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      - POSTGRES_DB=gis_db
      - POSTGRES_USER=gis_user
      - POSTGRES_PASSWORD=dev_password
    ports:
      - "5433:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gis_user -d gis_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Processing Container (Custom GIS Tools)
  processor:
    build: .
    volumes:
      - ./src:/app/src
      - ./data:/app/data  # Local data storage
    environment:
      - POSTGRES_DB=gis_db
      - POSTGRES_USER=gis_user
      - POSTGRES_PASSWORD=dev_password
      - POSTGRES_HOST=postgis
      - POSTGRES_PORT=5432
    depends_on:
      postgis:
        condition: service_healthy

  # 3. Workflow Engine (Airflow)
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://gis_user:dev_password@postgis:5432/gis_db
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://gis_user:dev_password@postgis:5432/gis_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - PYTHONPATH=/opt/airflow
      - POSTGRES_DB=gis_db
      - POSTGRES_USER=gis_user
      - POSTGRES_PASSWORD=dev_password
      - POSTGRES_HOST=postgis
      - POSTGRES_PORT=5432
      - OPENTOPOGRAPHY_API_KEY=${OPENTOPOGRAPHY_API_KEY:-}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./config:/opt/airflow/config
      - ./data:/opt/airflow/data  # Local data storage
      - ./.env:/opt/airflow/.env
    ports:
      - "8082:8080"
    user: "50000:0"
    command: bash -c "airflow db migrate && (airflow scheduler & airflow webserver)"
    depends_on:
      postgis:
        condition: service_healthy

  # 4. Map Server (GeoServer)
  geoserver:
    image: docker.osgeo.org/geoserver:2.24.0
    environment:
      - SKIP_DEMO_DATA=true
      - INSTALL_EXTENSIONS=true 
      - COMMUNITY_EXTENSIONS=pgraster-plugin
    ports:
      - "8085:8080"
    volumes:
      - ./geoserver_data:/opt/geoserver/data_dir
    depends_on:
      postgis:
        condition: service_healthy

  # 5. Web Dashboard (Frontend)
  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5005:5000"
    environment:
      - POSTGRES_DB=gis_db
      - POSTGRES_USER=gis_user
      - POSTGRES_PASSWORD=dev_password
      - POSTGRES_HOST=postgis
      - POSTGRES_PORT=5432
      - DATA_DIR=/app/data
    volumes:
      - ./frontend:/app
      - ./data:/app/data  # Local data storage
    depends_on:
      postgis:
        condition: service_healthy